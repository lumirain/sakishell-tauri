name: Build Release

# 触发：手动运行，或推送 v* 标签（如 v1.0.0）
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# 发布 Release / 上传 assets 需要写权限
permissions:
  contents: write

env:
  VERSION: 1.0.15

jobs:
  # ============ Windows：NSIS 安装包（含卸载程序） ============
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # 不写 version：自动读 package.json 里钉死的 packageManager（pnpm@11.15.1）

      - uses: actions/setup-node@v4
        # node-24：pnpm 11.x 的 store 实现依赖 node:sqlite（Node 22.5+ 才有），node-20 会 ERR_UNKNOWN_BUILTIN_MODULE
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set npm registry (CN mirror)
        run: npm config set registry https://registry.npmmirror.com
        shell: bash

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
        shell: bash

      # Rust 由 windows-latest 预装 stable；@tauri-apps/cli 在 devDependencies 中
      - name: Build NSIS installer & publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ env.VERSION }}
          releaseName: 'v${{ env.VERSION }}'
          releaseBody: 'SakiShell v${{ env.VERSION }} — AI-native SSH terminal with MCP server for AI clients.'
          releaseDraft: false
          prerelease: false

      # 用 SakiShell 自己的 minisign 私钥为安装包签名（自研更新链路的
      # latest.json signature 字段需要这段签名文本；tauri.conf 未启用内置
      # updater，签名在这里手动完成并上传 .sig）
      - name: Sign installer (minisign)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # 密钥为空密码，必须显式置空，否则 tauri signer 会尝试读密码失败
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          INSTALLER="src-tauri/target/release/bundle/nsis/SakiShell_${VERSION}_x64-setup.exe"
          pnpm tauri signer sign "$INSTALLER"
          gh release upload "v${VERSION}" "${INSTALLER}.sig" --repo lumirain/sakishell-tauri --clobber
          echo "签名文件已上传: ${INSTALLER}.sig"
