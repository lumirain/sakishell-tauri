name: Build Release

# 触发：手动运行，或推送 v* 标签（如 v1.0.0）
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# 发布 Release / 上传 assets 需要写权限
permissions:
  contents: write

env:
  VERSION: 1.0.17

jobs:
  # ============ 四平台构建矩阵：Windows x64/arm64 + macOS Intel/Apple Silicon ============
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            # NSIS 产物命名：x86_64 → x64
            suffix: x64-setup.exe
            artifact: saki-windows-x64
          - name: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            bundle: nsis
            # NSIS 产物命名：aarch64 → arm64
            suffix: arm64-setup.exe
            artifact: saki-windows-arm64
          - name: macos-intel
            os: macos-14
            target: x86_64-apple-darwin
            bundle: dmg
            # dmg 产物命名：x86_64 → x64
            suffix: x64.dmg
            artifact: saki-macos-x64
          - name: macos-apple-silicon
            os: macos-14
            target: aarch64-apple-darwin
            bundle: dmg
            # dmg 产物命名：aarch64 → aarch64
            suffix: aarch64.dmg
            artifact: saki-macos-aarch64
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # 不写 version：自动读 package.json 里钉死的 packageManager（pnpm@11.15.1）

      - uses: actions/setup-node@v4
        # node-24：pnpm 11.x 的 store 实现依赖 node:sqlite（Node 22.5+ 才有），node-20 会 ERR_UNKNOWN_BUILTIN_MODULE
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set npm registry (CN mirror)
        run: npm config set registry https://registry.npmmirror.com
        shell: bash

      # 仓库里入库的 .cargo/config.toml 把 crates.io 指向国内 USTC 镜像，
      # GitHub 机器上用它会变慢甚至不通，CI 里直接去掉，走官方源。
      - name: 去掉国内 cargo 镜像配置
        run: rm -f .cargo/config.toml
        shell: bash

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
        shell: bash

      # host target 上 rustup target add 是 no-op，统一执行保证交叉 target 就绪
      - name: Add rust target
        run: rustup target add ${{ matrix.target }}
        shell: bash

      # 构建并打包（不 publish，产物由后续 publish job 统一上传，避免多 job
      # 并发建 release 的竞态）。tauri-action 自动跑 vite build + tauri build。
      - name: Build bundle (${{ matrix.target }})
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}

      # 用 SakiShell 自己的 minisign 私钥为安装包签名（自研更新链路的
      # latest.json signature 字段需要这段签名文本；tauri.conf 未启用内置
      # updater，签名在这里手动完成并随包上传）。macOS 的 dmg 同样签名
      # （platforms 结构保留 signature，mac 端当前为手动下载、不校验）。
      - name: Sign bundle (minisign)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # 密钥为空密码，必须显式置空，否则 tauri signer 会尝试读密码失败
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          BUNDLE="src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.bundle }}/SakiShell_${{ env.VERSION }}_${{ matrix.suffix }}"
          if [ ! -f "$BUNDLE" ]; then
            echo "找不到构建产物: $BUNDLE" >&2
            find "src-tauri/target/${{ matrix.target }}/release/bundle" -maxdepth 2 -type f | head -20 >&2
            exit 1
          fi
          pnpm tauri signer sign "$BUNDLE"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.bundle }}/SakiShell_${{ env.VERSION }}_${{ matrix.suffix }}
            src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.bundle }}/SakiShell_${{ env.VERSION }}_${{ matrix.suffix }}.sig
          if-no-files-found: error

  # ============ 汇总发布：建 Release 并上传全部平台的安装包与签名 ============
  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true

      - name: List bundles
        run: ls -la bundles/

      - name: Create / update release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd bundles
          # release 已存在时 create 失败可忽略，随后统一 upload --clobber 覆盖
          gh release create "v${VERSION}" \
            --repo lumirain/sakishell-tauri \
            --title "v${VERSION}" \
            --notes "SakiShell v${VERSION} — AI-native SSH terminal with MCP server for AI clients." \
            || echo "release 已存在，跳过创建"
          gh release upload "v${VERSION}" ./* \
            --repo lumirain/sakishell-tauri \
            --clobber
          echo "已上传资产："
          ls -la
