name: Build Release

# 触发：手动运行，或推送 v* 标签（如 v1.0.0）
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# 发布 Release / 上传 assets 需要写权限
permissions:
  contents: write

env:
  VERSION: 1.0.0

jobs:
  # ============ Windows：NSIS 安装包（含卸载程序） ============
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set npm registry (CN mirror)
        run: npm config set registry https://registry.npmmirror.com
        shell: bash

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
        shell: bash

      # Rust 由 windows-latest 预装 stable；@tauri-apps/cli 在 devDependencies 中
      - name: Build NSIS installer & publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ env.VERSION }}
          releaseName: 'v${{ env.VERSION }}'
          releaseBody: 'SakiShell v${{ env.VERSION }} — AI-native SSH terminal with MCP server for AI clients.'
          releaseDraft: false
          prerelease: false
